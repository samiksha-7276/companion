<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 20px; background-color: #f8f9fa; color: #212529; }
        h1, h2 { color: #343a40; }
        #chat-form { display: flex; margin-bottom: 20px; }
        #message-input { flex-grow: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; }
        button { padding: 10px 15px; border: none; background-color: #007bff; color: white; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        button:hover { background-color: #0056b3; }
        #response-container { white-space: pre-wrap; background-color: #e9ecef; padding: 15px; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>
    <h1>Chat with Groq</h1>
    <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
    <h2>Response:</h2>
    <div id="response-container">
        <p>The AI's response will appear here.</p>
    </div>

    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const responseContainer = document.getElementById('response-container');

        chatForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = messageInput.value.trim();
            if (!message) return;

            responseContainer.innerHTML = '<p>Thinking...</p>';

            try {
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();
                responseContainer.innerHTML = response.ok ? `<p>${data.reply}</p>` : `<p style="color: red;">Error: ${data.details || 'An unknown error occurred.'}</p>`;
            } catch (error) {
                console.error('Fetch Error:', error);
                responseContainer.innerHTML = `<p style="color: red;">Error: Could not connect to the server. Is it running?</p>`;
            }
        });
    </script>
</body>
</html>
